<!DOCTYPE html><html><body style="margin:0;background:#888">
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c32" width="32" height="32"></canvas>
<img id="s" src="file:///workspace/public/favicon.svg" />
<script>
const img = document.getElementById('s');
img.onload = () => {
  for (const [id, size] of [['c16',16],['c32',32]]) {
    const c = document.getElementById(id);
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, size, size);
  }
  document.title = 'ready';
};
</script>
</body></html>

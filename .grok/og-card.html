<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>R2D2</title>
  <style>
    @font-face {
      font-family: "Space Grotesk";
      src: url("og-fonts/SpaceGrotesk.ttf") format("truetype");
      font-weight: 100 700;
      font-style: normal;
      font-display: block;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #15171A;
      color: #F7F8FA;
      font-family: "Space Grotesk", "Liberation Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      background:
        radial-gradient(ellipse 70% 80% at 78% 28%, rgba(91, 108, 255, 0.28), transparent 58%),
        radial-gradient(ellipse 55% 70% at 18% 78%, rgba(247, 248, 250, 0.06), transparent 55%),
        linear-gradient(160deg, #1C1F24 0%, #15171A 48%, #101216 100%);
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(247, 248, 250, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(247, 248, 250, 0.035) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse 70% 65% at 50% 48%, #000 20%, transparent 75%);
    }
    .ring {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 520px;
      height: 520px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 1px solid rgba(91, 108, 255, 0.22);
      box-shadow:
        0 0 0 48px rgba(91, 108, 255, 0.04),
        inset 0 0 80px rgba(91, 108, 255, 0.08);
    }
    .ring::after {
      content: "";
      position: absolute;
      inset: 72px;
      border-radius: 50%;
      border: 1px solid rgba(247, 248, 250, 0.06);
    }
    .weather-orb {
      position: absolute;
      right: 128px;
      top: 108px;
      width: 148px;
      height: 148px;
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12),
        0 18px 48px rgba(0, 0, 0, 0.42);
    }
    .weather-orb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 72px 120px 80px;
    }
    .kicker {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #5B6CFF;
    }
    h1 {
      font-size: 152px;
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 0.9;
      color: #F7F8FA;
      text-wrap: balance;
      text-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
    }
    .tag {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(247, 248, 250, 0.72);
    }
    .chips {
      display: flex;
      gap: 16px;
      margin-top: 22px;
    }
    .chip {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 168px;
      padding: 12px 16px 12px 12px;
      border-radius: 16px;
      background: rgba(28, 31, 36, 0.72);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.10);
      backdrop-filter: blur(12px);
    }
    .glyph {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: #5B6CFF;
      flex: none;
    }
    .glyph.paper { background: #F7F8FA; }
    .glyph.ink { background: #1C1F24; box-shadow: 0 0 0 1px rgba(255,255,255,0.12); }
    .chip span {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #F7F8FA;
    }
    .bar {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 4px;
      background: linear-gradient(90deg, #5B6CFF, #8b97ff 50%, #5B6CFF);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="grid"></div>
    <div class="ring"></div>
    <div class="weather-orb">
      <img src="../public/weather-icons/hero/sunny-hero.png" alt="" />
    </div>
    <div class="lockup">
      <div class="kicker">Command center</div>
      <h1>R2D2</h1>
      <div class="tag">Weather · Digest · Tasks</div>
      <div class="chips">
        <div class="chip">
          <div class="glyph">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <circle cx="12" cy="12" r="4" fill="#F7F8FA"/>
              <path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6" stroke="#F7F8FA" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <span>Weather</span>
        </div>
        <div class="chip">
          <div class="glyph paper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <rect x="5" y="3.5" width="14" height="17" rx="2" fill="#15171A"/>
              <path d="M8 9h8M8 12.5h8M8 16h5" stroke="#5B6CFF" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </div>
          <span>Digest</span>
        </div>
        <div class="chip">
          <div class="glyph ink">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
              <path d="M5 12.5l4.2 4.2L19 7.5" stroke="#5B6CFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span>Tasks</span>
        </div>
      </div>
    </div>
    <div class="bar"></div>
  </div>
</body>
</html>
